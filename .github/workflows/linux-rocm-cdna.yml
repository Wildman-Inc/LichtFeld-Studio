name: Linux ROCm CDNA CMake Compile

on:
  push:
    paths:
      - '.github/workflows/linux-rocm-cdna.yml'
      - '.github/overlays/**'
      - 'CMakeLists.txt'
      - '.gitmodules'
      - 'cmake/**'
      - 'external/**'
      - 'include/cuda_shim/**'
      - 'licenses/**'
      - 'src/**'
      - 'tests/hip/**'
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/linux-rocm-cdna.yml'
      - '.github/overlays/**'
      - 'CMakeLists.txt'
      - '.gitmodules'
      - 'cmake/**'
      - 'external/**'
      - 'include/cuda_shim/**'
      - 'licenses/**'
      - 'src/**'
      - 'tests/hip/**'
      - 'vcpkg.json'
      - 'vcpkg-configuration.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-rocm-cdna-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cdna-wave-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: rocm/dev-ubuntu-24.04:7.2.4-complete
    strategy:
      fail-fast: false
      matrix:
        amdgpu_arch: [gfx90a, gfx942, gfx950]

    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Verify ROCm compiler
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends cmake ninja-build
          cmake --version
          ninja --version
          /opt/rocm/bin/hipconfig --full
          /opt/rocm/bin/hipcc --version

      - name: Configure CMake HIP compile contract
        shell: bash
        run: |
          set -euo pipefail
          output_dir="${RUNNER_TEMP}/lichtfeld-cdna-${{ matrix.amdgpu_arch }}"
          cmake -S tests/hip/cmake -B "${output_dir}" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang++ \
            -DLFS_SOURCE_DIR="${GITHUB_WORKSPACE}" \
            -DLFS_AMDGPU_ARCH=${{ matrix.amdgpu_arch }}

          grep -F 'LFS_AMDGPU_ARCH:STRING=${{ matrix.amdgpu_arch }}' \
            "${output_dir}/CMakeCache.txt"
          grep -F 'CMAKE_HIP_ARCHITECTURES:STRING=${{ matrix.amdgpu_arch }}' \
            "${output_dir}/CMakeCache.txt"

      - name: Build core, training, VkSplat, and bit-exact HIP sources
        shell: bash
        run: |
          set -euo pipefail
          output_dir="${RUNNER_TEMP}/lichtfeld-cdna-${{ matrix.amdgpu_arch }}"
          cmake --build "${output_dir}" --parallel 32 --verbose
          commands="$(ninja -C "${output_dir}" -t commands)"
          for source in \
            cdna_wave_smoke.hip.cpp \
            vksplat_input_packer_cuda.cu \
            lod_page_dequant_cuda.cu \
            rad_encode_quant.cu; do
            printf '%s\n' "${commands}" \
              | grep -F -- "${source}" \
              | grep -F -- '--offload-arch=${{ matrix.amdgpu_arch }}'
          done
          printf '%s\n' "${commands}" \
            | grep -F -- 'lod_page_dequant_cuda.cu' \
            | grep -F -- '-ffp-contract=off'
          printf '%s\n' "${commands}" \
            | grep -F -- 'rad_encode_quant.cu' \
            | grep -F -- '-ffp-contract=off'

  full-app-link:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    container:
      image: rocm/dev-ubuntu-24.04:7.2.4@sha256:bdc8e61026cbb844ede93d44d2c50055f51ebb2041906b60182bf3bee3139054
    env:
      VCPKG_ROOT: ${{ github.workspace }}/../vcpkg
      VCPKG_FORCE_SYSTEM_BINARIES: 1
      VCPKG_DEFAULT_BINARY_CACHE: /github/home/.cache/vcpkg/archives
      VCPKG_MAX_CONCURRENCY: 2
      CMAKE_BUILD_PARALLEL_LEVEL: 2
      CMAKE_MAKE_PROGRAM: /usr/bin/ninja

    steps:
      - name: Prepare checkout dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git

      - name: Checkout source and submodules
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Free disk space
        shell: bash
        run: |
          set -euo pipefail
          apt-get clean
          rm -rf /var/lib/apt/lists/*
          rm -rf /usr/share/dotnet /opt/ghc /opt/hostedtoolcache /usr/local/lib/android
          df -h

      - name: Install full application build dependencies
        shell: bash
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates gpg wget
          wget -O - https://apt.kitware.com/keys/kitware-archive-latest.asc 2>/dev/null \
            | gpg --dearmor \
            | tee /usr/share/keyrings/kitware-archive-keyring.gpg >/dev/null
          echo 'deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ noble main' \
            > /etc/apt/sources.list.d/kitware.list
          apt-get update
          apt-get install -y --no-install-recommends \
            autoconf autoconf-archive automake ca-certificates ccache cmake curl \
            gcc-14 g++-14 git gpg libdbus-1-dev libdecor-0-dev libegl-dev \
            libgtk-3-dev libibus-1.0-dev libsystemd-dev libtool libvulkan-dev \
            libwayland-dev libxkbcommon-dev libxcursor-dev libxinerama-dev \
            libglu1-mesa-dev nasm ninja-build pkg-config python3 python3-dev \
            hipcub-dev hiprand-dev rocrand-dev rocthrust-dev \
            tar unzip wget xorg-dev zip
          cmake --version
          ninja --version
          dpkg-query -W hipcub-dev hiprand-dev rocrand-dev rocthrust-dev
          /opt/rocm/bin/hipconfig --full
          test -f /opt/rocm/lib/cmake/hiprand/hiprand-config.cmake
          test -f /opt/rocm/lib/cmake/rocrand/rocrand-config.cmake
          test -f /opt/rocm/include/hipcub/hipcub.hpp
          test -d /opt/rocm/include/thrust
          apt-get clean
          rm -rf /var/lib/apt/lists/*
          df -h

      - name: Cache vcpkg tool
        id: cache-vcpkg-tool
        uses: actions/cache@v5
        with:
          path: ${{ env.VCPKG_ROOT }}
          key: vcpkg-tool-${{ runner.os }}-rocm-full-app-2026-07-11

      - name: Set up vcpkg
        if: steps.cache-vcpkg-tool.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git clone https://github.com/microsoft/vcpkg.git "${VCPKG_ROOT}"
          "${VCPKG_ROOT}/bootstrap-vcpkg.sh" -disableMetrics

      - name: Configure vcpkg concurrency and cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${VCPKG_DEFAULT_BINARY_CACHE}"
          cat >> "${VCPKG_ROOT}/triplets/x64-linux.cmake" <<'EOF'
          set(VCPKG_BUILD_TYPE release)
          set(VCPKG_MAX_CONCURRENCY 2)
          EOF

      - name: Cache vcpkg packages
        id: cache-vcpkg-packages
        uses: actions/cache/restore@v5
        with:
          path: /github/home/.cache/vcpkg/archives
          key: vcpkg-pkgs-${{ runner.os }}-rocm-full-app-v1-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', '.github/overlays/**') }}
          restore-keys: vcpkg-pkgs-${{ runner.os }}-rocm-full-app-

      - name: Configure full Linux ROCm application
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-rocm-full -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_HIP_COMPILER=/opt/rocm/llvm/bin/clang++ \
            -DCMAKE_HIP_ARCHITECTURES=gfx942 \
            -DCMAKE_PREFIX_PATH=/opt/rocm \
            -DLFS_GPU_BACKEND=HIP \
            -DLFS_AMDGPU_ARCH=gfx942 \
            -DBUILD_PORTABLE=OFF \
            -DBUILD_TESTING=OFF \
            -DBUILD_PYTHON_STUBS=OFF \
            -DLFS_DEV_IMPORT_SOURCE_PYTHON=OFF \
            -DLFS_DEV_IMPORT_SOURCE_RESOURCES=OFF
          grep -E '^LFS_GPU_BACKEND(:[^=]+)?=HIP$' build-rocm-full/CMakeCache.txt
          grep -E '^CMAKE_HIP_ARCHITECTURES(:[^=]+)?=gfx942$' \
            build-rocm-full/CMakeCache.txt
          rm -rf \
            build-rocm-full/vcpkg_installed/vcpkg/blds \
            build-rocm-full/vcpkg_installed/vcpkg/pkgs \
            "${VCPKG_ROOT}/buildtrees" \
            "${VCPKG_ROOT}/downloads" \
            "${VCPKG_ROOT}/packages"
          df -h

      - name: Save configured vcpkg package cache
        if: steps.cache-vcpkg-packages.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: /github/home/.cache/vcpkg/archives
          key: ${{ steps.cache-vcpkg-packages.outputs.cache-primary-key }}

      - name: Build and load full Linux ROCm application
        shell: bash
        run: |
          set -euo pipefail
          set +e
          cmake --build build-rocm-full --parallel 2 --verbose \
            2>&1 | tee build-rocm-full/build.log
          build_status=${PIPESTATUS[0]}
          set -e
          if (( build_status != 0 )); then
            error_tail="$(sed -n -E \
              '/^FAILED:/,/^\[[0-9]+\/[0-9]+\]/p' \
              build-rocm-full/build.log | tail -c 18000)"
            if [[ -z "${error_tail}" ]]; then
              error_tail="$(tail -c 18000 build-rocm-full/build.log)"
            fi
            error_tail+=$'\n\n=== runner memory ===\n'
            error_tail+="$(free -h)"
            error_tail+=$'\n\n=== runner disk ===\n'
            error_tail+="$(df -h)"
            error_tail="${error_tail//'%'/'%25'}"
            error_tail="${error_tail//$'\r'/'%0D'}"
            error_tail="${error_tail//$'\n'/'%0A'}"
            printf '::error title=Full Linux ROCm build failed::%s\n' "${error_tail}"
            exit "${build_status}"
          fi
          commands="$(ninja -C build-rocm-full -t commands)"
          printf '%s\n' "${commands}" | grep -F -- '--offload-arch=gfx942' >/dev/null
          ldd build-rocm-full/LichtFeld-Studio | tee build-rocm-full/ldd.txt
          mapfile -d '' python_modules < <(find build-rocm-full -type f \
            -name 'lichtfeld*.so' -not -path '*/vcpkg_installed/*' -print0)
          if [[ ${#python_modules[@]} -eq 0 ]]; then
            echo 'The full Linux build did not produce the lichtfeld Python module.' >&2
            exit 1
          fi
          for module in "${python_modules[@]}"; do
            echo "=== ${module} ===" | tee -a build-rocm-full/ldd.txt
            ldd "${module}" | tee -a build-rocm-full/ldd.txt
          done
          if grep -F 'not found' build-rocm-full/ldd.txt; then
            echo 'The full Linux ROCm application has unresolved shared libraries.' >&2
            exit 1
          fi
          build-rocm-full/LichtFeld-Studio --version
