name: Linux ROCm CDNA Compile

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/linux-rocm-cdna.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'include/cuda_shim/**'
      - 'src/core/cuda/**'
      - 'src/core/include/core/cuda/**'
      - 'src/core/tensor/**'
      - 'src/training/**'
      - 'tests/hip/**'
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/linux-rocm-cdna.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'include/cuda_shim/**'
      - 'src/core/cuda/**'
      - 'src/core/include/core/cuda/**'
      - 'src/core/tensor/**'
      - 'src/training/**'
      - 'tests/hip/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cdna-wave-compile:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: rocm/dev-ubuntu-24.04:7.2.4-complete
    strategy:
      fail-fast: false
      matrix:
        amdgpu_arch: [gfx90a, gfx942, gfx950]

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Verify ROCm compiler
        shell: bash
        run: |
          set -euo pipefail
          /opt/rocm/bin/hipconfig --full
          /opt/rocm/bin/hipcc --version

      - name: Compile core and training wave reductions
        shell: bash
        run: |
          set -euo pipefail
          output_dir="${RUNNER_TEMP}/lichtfeld-cdna-${{ matrix.amdgpu_arch }}"
          mkdir -p "${output_dir}"
          common=(
            -std=c++20
            --offload-arch=${{ matrix.amdgpu_arch }}
            -DLFS_USE_HIP=1
            -DUSE_HIP=1
            -DUSE_ROCM=1
            -D__HIP_PLATFORM_AMD__
            -Iinclude/cuda_shim
            -Isrc/core/include
          )

          /opt/rocm/bin/hipcc "${common[@]}" \
            -Isrc/core/tensor \
            -c tests/hip/cdna_wave_smoke.hip.cpp \
            -o "${output_dir}/core-wave.o"

          /opt/rocm/bin/hipcc "${common[@]}" \
            -DLFS_TEST_TRAINING_WARP_REDUCE=1 \
            -Isrc/training/include \
            -c tests/hip/cdna_wave_smoke.hip.cpp \
            -o "${output_dir}/training-wave.o"
